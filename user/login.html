<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CrimeWatch – User Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#e84393;--dark:#0a0a0f;--card:#1a1a26;--surface:#12121a;--text:#f0f0f8;--muted:#9090b0;--border:#2a2a3d;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--dark);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:radial-gradient(ellipse at 30% 60%,rgba(10,61,98,.35) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 20%,rgba(232,67,147,.2) 0%,transparent 40%);}
.wrap{width:100%;max-width:420px;}
.brand{text-align:center;margin-bottom:28px;}
.brand-logo{width:64px;height:64px;background:linear-gradient(135deg,#0a3d62,var(--accent));
  border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;
  box-shadow:0 0 40px rgba(232,67,147,.3);}
.brand h1{font-size:24px;font-weight:700;}
.brand h1 span{color:var(--accent);}
.brand p{color:var(--muted);font-size:13px;margin-top:4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);}
.tabs{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:24px;}
.tab{flex:1;text-align:center;padding:10px;border-radius:7px;cursor:pointer;font-size:14px;
  font-weight:500;color:var(--muted);transition:all .2s;}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.iw{position:relative;}
.iw input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:12px 14px 12px 42px;font-size:14px;outline:none;transition:border-color .2s;}
.iw input:focus{border-color:var(--accent);}
.iw .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;}
.btn-main{width:100%;padding:13px;font-size:14px;font-weight:600;
  background:linear-gradient(135deg,#0a3d62,var(--accent));
  color:#fff;border:none;border-radius:10px;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 18px rgba(232,67,147,.3);}
.btn-main:hover{opacity:.9;transform:translateY(-1px);}
.note{display:flex;align-items:flex-start;gap:8px;background:rgba(0,184,148,.08);border:1px solid rgba(0,184,148,.2);
  border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--muted);}
.err{background:rgba(232,67,147,.1);border:1px solid rgba(232,67,147,.3);color:#ff88cc;
  border-radius:8px;padding:10px 12px;font-size:12px;margin-top:10px;display:none;}
.admin-link{text-align:center;margin-top:18px;font-size:13px;color:var(--muted);}
.admin-link a{color:var(--accent);text-decoration:none;font-weight:500;}
/* change pw modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;
  align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:380px;}
.modal h3{font-size:17px;font-weight:600;margin-bottom:6px;}
.modal p{font-size:13px;color:var(--muted);margin-bottom:18px;}
.pw-bar-wrap{height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden;}
.pw-bar{height:100%;border-radius:2px;transition:all .3s;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-logo">🛡️</div>
    <h1>CrimeWatch <span>India</span></h1>
    <p>Community Safety Platform</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="t-login" onclick="switchTab('login')">Sign In</div>
      <div class="tab" id="t-reg" onclick="switchTab('reg')">Register</div>
    </div>

    <!-- Login -->
    <div id="f-login">
      <div class="fg"><label>Email</label>
        <div class="iw"><span class="ic">📧</span><input type="email" id="l_em" placeholder="your@email.com"/></div></div>
      <div class="fg"><label>Password</label>
        <div class="iw"><span class="ic">🔑</span><input type="password" id="l_pw" placeholder="Password"/></div></div>
      <div class="note">💡 Default password for new accounts: <b style="color:#00b894">&nbsp;Welcome@123</b></div>
      <button class="btn-main" onclick="doLogin()">🚀 Sign In</button>
      <div class="err" id="l_err"></div>
    </div>

    <!-- Register -->
    <div id="f-reg" style="display:none">
      <div class="fg"><label>Full Name *</label>
        <div class="iw"><span class="ic">👤</span><input type="text" id="r_name" placeholder="Your name"/></div></div>
      <div class="fg"><label>Email *</label>
        <div class="iw"><span class="ic">📧</span><input type="email" id="r_em" placeholder="your@email.com"/></div></div>
      <div class="fg"><label>Phone</label>
        <div class="iw"><span class="ic">📱</span><input type="tel" id="r_ph" placeholder="+91 XXXXX XXXXX"/></div></div>
      <div class="fg"><label>Create Password * (min 8 characters)</label>
        <div class="iw"><span class="ic">🔑</span><input type="password" id="r_pw" placeholder="e.g. Pass@1234 (or leave blank for Welcome@123)"/></div></div>
      <button class="btn-main" onclick="doRegister()">✅ Create Account</button>
      <div class="err" id="r_err"></div>
    </div>
  </div>
  <div class="admin-link">Admin? <a href="../admin/login.html">Admin Portal →</a></div>
</div>

<!-- Change PW Modal -->
<div class="overlay" id="cpModal">
  <div class="modal">
    <h3>🔐 Set Your Password</h3>
    <p>Welcome! Please change your default password. Minimum 8 characters.</p>
    <div class="fg"><label>New Password</label>
      <div class="iw"><span class="ic">🔑</span>
        <input type="password" id="np" placeholder="New password" oninput="chkStr(this.value)"/></div>
      <div class="pw-bar-wrap"><div class="pw-bar" id="pwb"></div></div></div>
    <div class="fg"><label>Confirm Password</label>
      <div class="iw"><span class="ic">🔑</span><input type="password" id="cp" placeholder="Confirm"/></div></div>
    <button class="btn-main" onclick="doChangePw()">Set Password &amp; Continue</button>
    <div class="err" id="cp_err" style="display:none;margin-top:10px;"></div>
  </div>
</div>

<script src="../shared/crime-data-inline.js"></script>
<script src="../shared/db.js"></script>
<script>
let pendingUser=null;
function switchTab(t){
  ['login','reg'].forEach(k=>{
    document.getElementById('t-'+k).classList.toggle('active',k===t);
    document.getElementById('f-'+k).style.display=k===t?'block':'none';
  });
}
function doLogin(){
  const em=document.getElementById('l_em').value.trim();
  const pw=document.getElementById('l_pw').value;
  const err=document.getElementById('l_err');
  err.style.display='none';
  if(!em||!pw){err.textContent='⚠️ Please fill in all fields.';err.style.display='block';return;}
  const u=CrimeDB.loginUser(em,pw);
  if(!u){err.textContent='⚠️ Invalid email or password.';err.style.display='block';return;}
  if(u.mustChange){pendingUser=u;document.getElementById('cpModal').classList.add('show');return;}
  CrimeDB.setSession('user',u);window.location.href='home.html';
}
function doRegister(){
  const name = document.getElementById('r_name').value.trim();
  const em   = document.getElementById('r_em').value.trim();
  const ph   = document.getElementById('r_ph').value.trim();
  const pw   = document.getElementById('r_pw').value;
  const err  = document.getElementById('r_err');
  err.style.display = 'none';

  if (!name || !em) {
    err.textContent = '⚠️ Name and email are required.';
    err.style.display = 'block';
    return;
  }

  if (pw && pw.length < 8) {
    err.textContent = '⚠️ Password must be at least 8 characters.';
    err.style.display = 'block';
    return;
  }

  const res = CrimeDB.registerUser(name, em, ph, pw || 'Welcome@123');
  if (res.error) {
    err.textContent = '⚠️ ' + res.error;
    err.style.display = 'block';
    return;
  }

  // If user entered their own password >= 8 chars, log them in directly!
  if (pw && pw.length >= 8) {
    res.user.mustChange = false;
    CrimeDB.setSession('user', res.user);
    window.location.href = 'home.html';
    return;
  }

  pendingUser = res.user;
  document.getElementById('cpModal').classList.add('show');
}
function chkStr(pw){
  let s=0;if(pw.length>=8)s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;
  const b=document.getElementById('pwb');
  b.style.width=(s*25)+'%';b.style.background=['#e74c3c','#f39c12','#00b894','#00b894'][s-1]||'#2a2a3d';
}
function doChangePw(){
  const np=document.getElementById('np').value;
  const cp=document.getElementById('cp').value;
  const err=document.getElementById('cp_err');
  err.style.display='none';
  if(np.length<8){err.textContent='Minimum 8 characters required.';err.style.display='block';return;}
  if(np!==cp){err.textContent='Passwords do not match.';err.style.display='block';return;}
  CrimeDB.changeUserPassword(pendingUser.id,np);
  pendingUser.password=np;pendingUser.mustChange=false;
  CrimeDB.setSession('user',pendingUser);window.location.href='home.html';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('cpModal').classList.contains('show')) {
      doChangePw();
    } else if (document.getElementById('f-reg').style.display === 'block') {
      doRegister();
    } else {
      doLogin();
    }
  }
});
</script>
</body>
</html>
